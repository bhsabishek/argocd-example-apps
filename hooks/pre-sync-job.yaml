apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting database migration"
              sleep 5
              echo "Migration completed successfully"
              exit 0
